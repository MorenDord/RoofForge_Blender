[package]
name = "roof_forge_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "roof_forge_native"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python-extension = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["abi3-py310"], optional = true }
