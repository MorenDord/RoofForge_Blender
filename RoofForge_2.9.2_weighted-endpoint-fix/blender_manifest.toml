schema_version = "1.0.0"
id = "roof_forge"
version = "2.9.3"
name = "RoofForge"
tagline = "Spatial roofs, pitch, overhangs and ridge/valley profiles"
maintainer = "OpenAI"
type = "add-on"
blender_version_min = "5.0.0"
license = ["SPDX:GPL-3.0-or-later"]

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "test_*.py",
  "*.blend",
  "*.zip",
  "README_RU.md",
  "SPATIAL_ROOF_DESIGN_RU.md",
]
